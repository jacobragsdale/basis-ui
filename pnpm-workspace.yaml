packages:
  - packages/*

catalogMode: strict

# orval bundles its mutator with esbuild, whose install script only checks the platform binary that pnpm installs anyway,
# so it does not run.
allowBuilds:
  esbuild: false
  # buf's install script only checks the platform binary that pnpm installs as an optional dependency, which its
  # command finds without it, so it does not run.
  "@bufbuild/buf": false

catalog:
  "@babel/core": 7.29.13
  "@base-ui/react": 1.9.0
  "@bufbuild/buf": 1.75.0
  "@bufbuild/protobuf": 2.16.0
  # protoc-gen-es's version must be @bufbuild/protobuf's, whose runtime the code it generates imports.
  "@bufbuild/protoc-gen-es": 2.16.0
  "@faker-js/faker": 10.6.0
  "@fontsource-variable/inter": 5.3.0
  "@fontsource-variable/jetbrains-mono": 5.3.0
  happy-dom: 21.0.4
  oxc-parser: 0.148.0
  # The version whose Docker image parallax's end-to-end specs and its demo's run in. The Angular layer's screenshots and
  # canvases, kept since step 2.7 deleted it, were recorded in this image, and the React ones are compared with them
  # pixel for pixel; a newer image renders text differently, so moving to the workspace's Playwright means recording
  # every baseline again and retiring those comparisons.
  "@playwright/test": 1.64.1
  "@rolldown/plugin-babel": 0.3.0
  "@shadcn/lint": 0.2.5
  "@tailwindcss/node": 4.3.5
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.106.1
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-table": 9.3.1
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@types/culori": 4.0.1
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  "@vitest/browser-playwright": 5.1.0
  apache-arrow: 21.2.0
  babel-plugin-react-compiler: 1.0.0
  cn: 0.5.2
  culori: 4.0.2
  msw: 3.0.4
  orval: 8.46.0
  playwright: 1.65.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.5
  typescript: 7.0.2
  vite-plus: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest-browser-react: 2.3.0
  zod: 4.6.7

overrides:
  # orval 8.45 and later bring TypeScript 6 through @orval/zod and @orval/hono; only the workspace's TypeScript stays
  # (docs/spikes/orval.md, answer 1).
  typescript: "catalog:"
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@tailwindcss/node@4.3.5"
  - tailwindcss@4.3.5
  - "@tailwindcss/oxide-android-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-x64@4.3.5"
  - "@tailwindcss/oxide-freebsd-x64@4.3.5"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.5"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.5"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.5"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.5"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.5"
  - "@tailwindcss/oxide@4.3.5"
  - "@tailwindcss/vite@4.3.5"
