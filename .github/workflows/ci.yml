name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting, linting and type checking cover the whole repo, docs included, so they run on every change.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check

  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            ui:
              - "packages/ui/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - "vite.config.ts"
              - ".node-version"
              - ".github/workflows/ci.yml"

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run @basis/ui#test
      - run: vp run @basis/ui#build
