name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting, linting and type checking cover the whole repo, docs included, so they run on every change.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      # The gallery type-checks against @basis/ui's built declarations, as an app does.
      - run: vp run @basis/ui#build
      - run: vp check

  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      parallax: ${{ steps.filter.outputs.parallax }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            ui:
              - "packages/ui/**"
              - "packages/gallery/**"
              - "packages/example/**"
              # The formatter's tests read the fixtures parallax's Rust formatter writes.
              - "packages/parallax/crates/parallax-engine/tests/fixtures/format.json"
              # The client tasks' tests generate a client from spike 0.2's document.
              - "docs/spikes/orval/openapi.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - "vite.config.ts"
              - ".node-version"
              - ".github/workflows/ci.yml"
            parallax:
              - "packages/parallax/**"
              - ".github/workflows/ci.yml"

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run @basis/ui#build
      - run: vp run @basis/ui#test
      # The gallery and the example consume @basis/ui's build, and their browser tests run in the Chromium that the
      # preset's Playwright version pins.
      - run: vp exec --filter @basis/ui playwright install --with-deps chromium
      - run: vp run @basis/gallery#test
      - run: vp run @basis/gallery#build
      # The example app proves the app shell: its client must match its openapi.json, and its tests run in Chromium.
      - run: vp run @basis/example#client-check
      - run: vp run @basis/example#test
      - run: vp run @basis/example#build

  # Parallax's jobs, moved with it from its own repo. It runs only in the browser, so none needs a database or a server.
  parallax-rust:
    name: parallax / Rust (format, lint, test)
    needs: changes
    if: needs.changes.outputs.parallax == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/parallax
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parallax -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  parallax-webassembly:
    name: parallax / WebAssembly (build and test in Node)
    needs: changes
    if: needs.changes.outputs.parallax == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/parallax
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parallax -> target
      # The test runner must match the wasm-bindgen version in Cargo.lock.
      - name: Install wasm-bindgen-test-runner
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen-test-runner" /usr/local/bin/
      - run: cargo test -p parallax-wasm --target wasm32-unknown-unknown --locked

  parallax-web:
    name: parallax / Web (lint, format, unit tests, build)
    needs: changes
    if: needs.changes.outputs.parallax == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/parallax/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/parallax/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/parallax/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The generated protocol code must match crates/parallax-protocol/proto/parallax.proto.
      - run: pnpm generate && git diff --exit-code -- projects/parallax/src/lib/proto
      # The browser engine: the worker's types and the package's wasm folder come from it.
      - run: rustup toolchain install
        working-directory: packages/parallax
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/parallax -> target
      - name: Install wasm-bindgen
        working-directory: packages/parallax
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - run: pnpm build:wasm
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The demo's datasets, generated by parallax-datagen into the demo's public folder, which the build copies.
      - run: pnpm build:data
      - run: pnpm build
      # The end-to-end job tests this build of the demo, browser engine and data included.
      - uses: actions/upload-artifact@v7
        with:
          name: parallax-demo
          path: packages/parallax/web/dist/demo
          retention-days: 1

  parallax-e2e:
    name: parallax / End to end (Playwright, Chromium without a GPU)
    needs: parallax-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/parallax/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/parallax/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/parallax/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: parallax-demo
          path: packages/parallax/web/dist/demo
      # Every spec, the screenshots included, runs in the Playwright image matching @playwright/test, so that the
      # browser and fonts match the committed screenshots, against the demo built above, served as static files.
      - run: pnpm e2e:image
        env:
          PARALLAX_PREBUILT: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: parallax-playwright-results
          path: packages/parallax/web/test-results

  parallax-dependencies:
    name: parallax / Dependency licences and advisories
    needs: changes
    if: needs.changes.outputs.parallax == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/parallax/Cargo.toml
          command: check licenses bans sources advisories
