name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main runs to the end, queued behind the one before, so main always has a complete run; a branch's
  # newer push cancels its older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No RUSTFLAGS here: Cargo takes RUSTFLAGS in place of a target's own flags, so a global one hid the wasm build's
# +simd128 and CI never built the engine as it ships. Warnings are errors in the jobs that set them, each its own way.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, linting and type checking cover the whole repo, docs included, so they run on every change.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      # The gallery type-checks against @basis/ui's built declarations, as an app does.
      - run: vp run @basis/ui#build
      - run: vp check

  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      parallax: ${{ steps.filter.outputs.parallax }}
      template: ${{ steps.filter.outputs.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ui:
              - "packages/ui/**"
              - "packages/gallery/**"
              # The client tasks' tests also generate a client from the example's copy of basis's sample document.
              - "packages/example/**"
              # The app ctzd-style hand-written configuration is checked on.
              - "packages/consumer/**"
              # The catalogue reads parallax's components, hooks and types from its source, and a test fails while stale.
              - "packages/parallax/src/**"
              # The formatter's tests read the fixtures parallax's Rust formatter writes.
              - "packages/parallax/crates/parallax-engine/tests/fixtures/format.json"
              # The dates tests check the SIFMA calendar against each year parallax's Rust calendar writes.
              - "packages/parallax/crates/parallax-engine/tests/fixtures/sifma.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - "vite.config.ts"
              - ".node-version"
              - ".github/workflows/ci.yml"
            parallax:
              - "packages/parallax/**"
              - "packages/parallax-demo/**"
              - "packages/showcase/**"
              - "packages/showcase-data/**"
              # The Rust SIFMA calendar is tested against the schedules SIFMA published, which `@basis/ui` keeps.
              - "packages/ui/tests/fixtures/calendars/sifma.json"
              - ".github/workflows/ci.yml"
            # The app made from the template is installed from both packages' tarballs.
            template:
              - "packages/ui/**"
              - "packages/parallax/src/**"
              - "packages/create/**"
              # The catalog names the versions @basis/ui's tarball depends on.
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run @basis/ui#build
      # Browser tests run in the Chromium that the preset's Playwright version pins: the gallery's and the example's,
      # and @basis/ui's own tests of shot, which pictures a page, and of budget, which weighs one; its tree-shaking test
      # bundles its build.
      # Playwright's download has hung on a runner for half an hour: three minutes, then once more.
      - name: Install Playwright's Chromium
        timeout-minutes: 7
        run: |
          timeout 3m vp exec --filter @basis/ui playwright install --with-deps chromium ||
            timeout 3m vp exec --filter @basis/ui playwright install --with-deps chromium
      - run: vp run @basis/ui#test
      - run: vp run @basis/gallery#test
      # The gallery's render matrix again, in a Node DOM, as on a machine with no browser.
      - run: vp run @basis/gallery#test-node
      - run: vp run @basis/gallery#build
      # The example app proves the app shell: `vp run verify`, every stage of an app's check, its client against its
      # openapi.json, its tests in Chromium and its build among them.
      - run: vp run @basis/example#verify
      # The same app on a machine with no browser: the tests written with @basis/ui/testing, in a Node DOM.
      - run: vp run @basis/example#test-node
      # The consumer app is configured by hand with the README's lines, as ctzd writes its apps, and passes verify as
      # one: its configuration, lint, types, test and build, and its budget, weighed in Chromium.
      - run: vp run @basis/consumer#verify

  # The template, proven: an app made as its developer makes one, `vp dlx @basis/create NAME` from the packed
  # @basis/create, outside the workspace, installed from the packed @basis/ui and @basis/parallax, whose engine comes
  # built in its tarball, then committed through its hook and checked as its developer checks it, with `vp run verify`,
  # `vp run shot --all` and `vp build` (packages/create/scripts/prove.ts). The tarballs go on to the Windows job.
  template:
    name: create / The template, made into an app from the packed packages
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
      # Its cache is pnpm's store, which the app's install takes its packages from.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
          cache: true
      - run: rustup toolchain install
        timeout-minutes: 5
        working-directory: packages/parallax
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 5
        with:
          workspaces: packages/parallax -> target
      - name: Install wasm-bindgen
        timeout-minutes: 3
        working-directory: packages/parallax
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - run: vp run @basis/ui#build
        timeout-minutes: 5
      - run: vp run @basis/parallax#build
        timeout-minutes: 10
      # The app's tests and shots run in the Chromium the preset's Playwright pins, as the workspace's do.
      - name: Install Playwright's Chromium
        timeout-minutes: 7
        run: |
          timeout 3m vp exec --filter @basis/ui playwright install --with-deps chromium ||
            timeout 3m vp exec --filter @basis/ui playwright install --with-deps chromium
      # The three packages as a release ships them, and the Playwright version @basis/ui pins, for the Windows job.
      - name: Pack @basis/ui, @basis/parallax and @basis/create
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for name in ui parallax create; do
            (cd "packages/$name" && vp pm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          node -p "require('./packages/ui/node_modules/playwright/package.json').version" > "$RUNNER_TEMP/tarballs/playwright-version"
      # Makes the app, installs, commits, verifies, shoots every route and builds; a stage that fails names itself in
      # its ERROR line.
      - run: node packages/create/scripts/prove.ts --tarballs "$RUNNER_TEMP/tarballs"
        timeout-minutes: 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-tarballs
          path: ${{ runner.temp }}/tarballs
          retention-days: 3

  # The same proof on Windows, the firm's desktop, in PowerShell as a developer's terminal is: the Linux job's tarballs,
  # so it needs no Rust and no install of the workspace. It holds what winbox proved by hand (docs/release-plan.md, "On
  # winbox"): the install, the commit through the hook, `vp run verify`, `vp run shot --all` started with no dev server,
  # which must stop the one it starts, `vp build`, and a clean tree.
  template-windows:
    name: create / The template on Windows, from the packed packages
    needs: template
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
      # Vite+ and the Node .node-version pins; the proof is plain Node, and the app installs its own.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
          run-install: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: template-tarballs
          path: ${{ runner.temp }}/tarballs
      # The app's paths under node_modules can pass Windows' old limit of 260 characters.
      - run: git config --global core.longpaths true
      # As vp run doctor names it: the Chromium of the Playwright @basis/ui pins, from Playwright's own download site.
      - name: Install Playwright's Chromium
        timeout-minutes: 7
        run: |
          $version = Get-Content "$env:RUNNER_TEMP/tarballs/playwright-version"
          vp dlx "playwright@$version" install chromium
      - run: node packages/create/scripts/prove.ts --tarballs "$env:RUNNER_TEMP/tarballs"
        timeout-minutes: 20

  # The gallery's eleven whole-page screenshots and the axe check on every section, in the pinned Playwright image,
  # against the gallery built here on @basis/ui's build. A change to either runs them.
  gallery-shots:
    name: ui / Gallery screenshots and axe (Playwright image)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      # Builds @basis/ui and the gallery, and runs the whole-page screenshots and every section's axe check in the image.
      - run: vp run @basis/gallery#shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: gallery-shots-results
          path: packages/gallery/test-results/shots

  # @basis/parallax: the protocol's generated code, the engine built for the browser, the package built around it, and
  # its tests, in Node and in Chromium, then the demo's tests and build on it. It depends on @basis/ui, so it runs when
  # either changes.
  parallax-package:
    name: parallax / @basis/parallax and its demo (build, unit and browser tests)
    needs: changes
    if: needs.changes.outputs.parallax == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      # The runner's cores: the engine's build uses one rustc job unless told more.
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: rustup toolchain install
        working-directory: packages/parallax
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/parallax -> target
      - name: Install wasm-bindgen
        working-directory: packages/parallax
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      # The committed protocol code must be what buf generates from crates/parallax-protocol/proto/parallax.proto.
      - run: vp run @basis/parallax#proto && git diff --exit-code -- packages/parallax/src/proto
      - run: vp run @basis/ui#build
      # Builds the engine first, with wasm-bindgen --remove-name-section.
      - run: vp run @basis/parallax#build
      # The committed declaration of wasm-bindgen's glue, which `vp check` type-checks against, must be this build's.
      - run: git diff --exit-code -- packages/parallax/wasm/parallax_wasm.d.ts
      # The engine as it ships: built with SIMD, which its target_features section names.
      - name: The engine's WebAssembly is built with SIMD
        run: |
          node -e '
            const bytes = require("node:fs").readFileSync("packages/parallax/dist/parallax_wasm_bg.wasm");
            const [section] = WebAssembly.Module.customSections(new WebAssembly.Module(bytes), "target_features");
            const names = section === undefined ? "" : Buffer.from(section).toString("latin1");
            if (!names.includes("simd128")) {
              console.error("ERROR the engine was built without +simd128, as its target_features section shows: check that nothing sets RUSTFLAGS, which hides the wasm target'"'"'s own flags.");
              process.exit(1);
            }
            console.log("target_features names simd128");
          '
      # Playwright's download has hung on a runner for half an hour: three minutes, then once more.
      - name: Install Playwright's Chromium
        timeout-minutes: 7
        run: |
          timeout 3m vp exec --filter @basis/ui playwright install --with-deps chromium ||
            timeout 3m vp exec --filter @basis/ui playwright install --with-deps chromium
      - run: vp run @basis/parallax#test
      # The demo runs the package's build, as an app does: its browser tests, with the engine's real worker, and its
      # build.
      - run: vp run @basis/parallax-demo#test
      - run: vp run @basis/parallax-demo#build
      # The showcase, an app made from the template, verified as an app is, on small tables of its generated data: the
      # 1,000,000-row tables are too large for a runner's every push.
      - run: vp run @basis/showcase-data#data 5000
      - run: vp run @basis/showcase#verify

  # The React chart's end-to-end specs and screenshots, in the pinned Playwright image, against the harness built from
  # the package's source and the datasets parallax-datagen writes. Its chrome is @basis/ui's, so a change to either runs
  # them.
  parallax-charts-e2e:
    name: parallax / Charts end to end (React harness, Playwright image)
    needs: changes
    if: needs.changes.outputs.parallax == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: rustup toolchain install
        working-directory: packages/parallax
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/parallax -> target
      - name: Install wasm-bindgen
        working-directory: packages/parallax
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - run: vp run @basis/ui#build
      # Builds the engine, writes the datasets, builds the harness, and runs every spec in the image.
      - run: vp run @basis/parallax#charts-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: parallax-charts-e2e-results
          path: packages/parallax/test-results/charts-e2e

  # The React grid's end-to-end specs, its screenshots and its canvas against the Angular demo's recorded screenshots, in
  # the same Playwright image, against its own harness, built here from the package's source and the demo's datasets.
  parallax-grid-e2e:
    name: parallax / Grid end to end (React harness, Playwright image)
    needs: changes
    if: needs.changes.outputs.parallax == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: rustup toolchain install
        working-directory: packages/parallax
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/parallax -> target
      - name: Install wasm-bindgen
        working-directory: packages/parallax
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - run: vp run @basis/ui#build
      # Builds the engine, writes the datasets, builds the harness, and runs every spec in the image.
      - run: vp run @basis/parallax#grid-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: parallax-grid-e2e-results
          path: packages/parallax/test-results/grid-e2e

  # The React pivot's end-to-end specs, its screenshots and its canvas against the Angular pivot's recorded canvas, in the
  # same Playwright image, against its own harness, built here from the package's source and the demo's positions.
  parallax-pivot-e2e:
    name: parallax / Pivot end to end (React harness, Playwright image)
    needs: changes
    if: needs.changes.outputs.parallax == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: rustup toolchain install
        working-directory: packages/parallax
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/parallax -> target
      - name: Install wasm-bindgen
        working-directory: packages/parallax
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - run: vp run @basis/ui#build
      # Builds the engine, writes the dataset, builds the harness, and runs every spec in the image.
      - run: vp run @basis/parallax#pivot-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: parallax-pivot-e2e-results
          path: packages/parallax/test-results/pivot-e2e

  # The demo's end-to-end specs and screenshots, in the same Playwright image, against the demo built here as an app
  # builds it, from the package's build, and the datasets parallax-datagen writes.
  parallax-demo-e2e:
    name: parallax / Demo end to end (React app on @basis/ui, Playwright image)
    needs: changes
    if: needs.changes.outputs.parallax == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: rustup toolchain install
        working-directory: packages/parallax
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/parallax -> target
      - name: Install wasm-bindgen
        working-directory: packages/parallax
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
      - run: vp run @basis/ui#build
      # Builds the package, writes the datasets, builds the demo, and runs every spec in the image.
      - run: vp run @basis/parallax-demo#e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: parallax-demo-e2e-results
          path: packages/parallax-demo/test-results/e2e

  # Parallax's jobs, moved with it from its own repo. It runs only in the browser, so none needs a database or a server.
  parallax-rust:
    name: parallax / Rust (format, lint, test)
    needs: changes
    if: needs.changes.outputs.parallax == 'true'
    runs-on: ubuntu-latest
    # Native builds only, so RUSTFLAGS hides no target's flags here.
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        working-directory: packages/parallax
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/parallax -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  parallax-webassembly:
    name: parallax / WebAssembly (build and test in Node)
    needs: changes
    if: needs.changes.outputs.parallax == 'true'
    runs-on: ubuntu-latest
    # The wasm target's flags as the browser's build sets them (scripts/build-wasm.ts), with warnings as errors.
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -D warnings -C target-feature=+simd128
    defaults:
      run:
        working-directory: packages/parallax
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/parallax -> target
      # The test runner must match the wasm-bindgen version in Cargo.lock.
      - name: Install wasm-bindgen-test-runner
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 755 "wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen-test-runner" /usr/local/bin/
      - run: cargo test -p parallax-wasm --target wasm32-unknown-unknown --locked

  parallax-dependencies:
    name: parallax / Dependency licences and advisories
    needs: changes
    if: needs.changes.outputs.parallax == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: packages/parallax/Cargo.toml
          command: check licenses bans sources advisories
