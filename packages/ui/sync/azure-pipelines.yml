# This file is managed by basis-ui: `vp run sync` rewrites it from the installed @basis/ui, and `vp run verify` fails when it differs.
# Unverified: not yet run in Azure DevOps. The checks every change passes, then the build the image serves.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: ["*"]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: check
    jobs:
      - job: verify
        steps:
          - script: curl -fsSL https://vite.plus | bash
            displayName: Install Vite+
          - script: |
              . "$HOME/.config/vite-plus/env"
              vp install --frozen-lockfile
              playwright=$(node -p "require(require('module').createRequire(require.resolve('@basis/ui/package.json')).resolve('playwright/package.json')).version")
              vp dlx "playwright@$playwright" install --with-deps chromium
              vp run verify
            displayName: vp run verify, which builds
