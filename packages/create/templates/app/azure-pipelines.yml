# Unverified: not yet run in Azure DevOps. The checks every change passes, then the build the image serves.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: ["*"]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: check
    jobs:
      - job: check_full
        steps:
          - script: curl -fsSL https://vite.plus | bash
            displayName: Install Vite+
          - script: |
              . "$HOME/.config/vite-plus/env"
              vp install --frozen-lockfile
              vp exec playwright install --with-deps chromium
              vp run check-full
              vp build
            displayName: vp run check-full and vp build
