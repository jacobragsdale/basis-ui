[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/jacobragsdale/basis-ui"

[workspace.dependencies]
parallax-datagen = { path = "crates/parallax-datagen", version = "0.1.0" }
parallax-engine = { path = "crates/parallax-engine", version = "0.1.0" }
parallax-export = { path = "crates/parallax-export", version = "0.1.0" }
parallax-protocol = { path = "crates/parallax-protocol", version = "0.1.0" }
parallax-session = { path = "crates/parallax-session", version = "0.1.0" }
anyhow = "1.0.104"
arrow-array = { version = "60.1", default-features = false }
arrow-buffer = { version = "60.1", default-features = false }
arrow-ipc = { version = "60.1", default-features = false }
arrow-schema = { version = "60.1", default-features = false }
arrow-select = { version = "60.1", default-features = false }
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }
libm = "0.2.16"
rayon = "1.12"
# Exact decimals in JSON need arbitrary precision in every crate that reads them.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The browser's build (scripts/build-wasm.ts): the whole program optimised as one
# unit, which measured faster than release's defaults (docs/spikes/scale-1m.md).
# Integer overflow panics, as in the native tests, rather than wrapping silently
# into a wrong number: on 2026-11-13 it cost 0.7% of the module's size and no
# time the bench could tell from its noise.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
overflow-checks = true

# Dependencies build without debug info: it halves rustc's memory for large crates
# such as js-sys and arrow, which matters on memory-constrained machines.
[profile.dev.package."*"]
debug = false
