# The demo in its container image (the Dockerfile at the repository root): the
# demo app served next to generated datasets, on port 8080 of every interface.
#   docker build -t parallax . && docker run --rm -p 8080:8080 parallax
# The row counts fit a memory-constrained build host; grid drawing cost depends on
# the visible window, not on the table size.

listen = "0.0.0.0:8080"
static_dir = "/srv/demo"
# Lets the demo's performance overlay measure the whole tab, worker included.
# Browsers honour it over https and on localhost, and ignore it over plain http.
cross_origin_isolated = true

[[dataset]]
name = "positions"
primary_key = "position_id"
[dataset.source]
kind = "generator"
dataset = "positions"
rows = 200000

[[dataset]]
name = "trades"
primary_key = "trade_id"
[dataset.source]
kind = "generator"
dataset = "trades"
rows = 1000000

# The same generated positions, copied into the browser: views run in the page's
# WebAssembly worker and must show exactly what the server's views show.
[[dataset]]
name = "positions_browser"
primary_key = "position_id"
browser = true
[dataset.source]
kind = "generator"
dataset = "positions"
rows = 200000

# Daily prices for 50 tickers, small enough to hold in the browser.
[[dataset]]
name = "prices"
browser = true
[dataset.source]
kind = "generator"
dataset = "prices"
tickers = 50

# Small tables, the size most tables are: 300 positions held in the browser and
# 500 trades held on the server, so the demo can time both at that size.
[[dataset]]
name = "book"
primary_key = "position_id"
browser = true
[dataset.source]
kind = "generator"
dataset = "positions"
rows = 300

[[dataset]]
name = "blotter"
primary_key = "trade_id"
[dataset.source]
kind = "generator"
dataset = "trades"
rows = 500
