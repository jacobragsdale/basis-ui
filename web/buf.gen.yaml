# Generates the TypeScript protocol code from crates/parallax-protocol/proto/parallax.proto,
# the same file the Rust crates compile. Run `pnpm generate`.
version: v2
inputs:
  - directory: ../crates/parallax-protocol/proto
plugins:
  - local: protoc-gen-es
    out: projects/parallax/src/lib/proto
    opt:
      - target=ts
      - import_extension=none
